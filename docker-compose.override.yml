# ไฟล์นี้ compose อ่านเพิ่มให้อัตโนมัติตอนรันบนเครื่องตัวเอง (ไม่ต้องสั่งอะไรเพิ่ม)
# ใช้ตอน dev อย่างเดียว — เปิด port ไว้ debug และ mount โค้ดเข้าไปให้แก้แล้วเห็นผลทันที
#
# แก้ไฟล์ใน app/ แล้ว uvicorn --reload จะรีสตาร์ทให้เองภายในไม่กี่วินาที ไม่ต้อง build ใหม่
# แต่ถ้าแก้ requirements.txt / Dockerfile / ไฟล์นอก app/ ต้อง  docker compose up -d --build <service>
#
# WATCHFILES_FORCE_POLLING: บน Windows (และ Mac บางเครื่อง) docker มองไม่เห็นว่าไฟล์ในเครื่องเราเปลี่ยน
# ถ้าไม่เปิด reload จะเงียบ แก้โค้ดแล้วได้ผลของโค้ดเก่า — เปิดไว้ทุกเครื่องให้เหมือนกัน
#
# เวลาจะรันแบบ "เหมือนของจริง" ให้สั่ง  docker compose -f docker-compose.yml up

x-dev-reload: &dev-reload
  command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/srv/app"]

x-dev-env: &dev-env
  WATCHFILES_FORCE_POLLING: "true"

services:
  api:
    <<: *dev-reload
    environment: *dev-env
    volumes: ["./services/02_api_backend/app:/srv/app:ro"]
  router:
    <<: *dev-reload
    environment: *dev-env
    ports: ["8003:8000"]
    volumes: ["./services/03_ai_router_agent/app:/srv/app:ro"]
  engines:
    <<: *dev-reload
    environment: *dev-env
    ports: ["8004:8000"]
    volumes: ["./services/04_ai_model_selection/app:/srv/app:ro"]
  retrieval:
    <<: *dev-reload
    environment: *dev-env
    ports: ["8005:8000"]
    volumes: ["./services/05_retrieval_knowledge/app:/srv/app:ro"]
  generation:
    <<: *dev-reload
    environment: *dev-env
    ports: ["8006:8000"]
    volumes: ["./services/06_llm_generation/app:/srv/app:ro"]
  response-log:
    <<: *dev-reload
    environment: *dev-env
    ports: ["8007:8000"]
    volumes: ["./services/07_response_logging/app:/srv/app:ro"]
  postgres:
    ports: ["5432:5432"]
